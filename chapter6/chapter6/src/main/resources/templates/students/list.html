<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh sách sinh viên</title>
</head>
<body>
<section>

    <!-- Tiêu đề và nút thêm mới -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0"><i class="bi bi-people-fill me-2"></i>Danh sách sinh viên</h3>
        <a th:href="@{/students/create}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sinh viên
        </a>
    </div>

    <!-- Thanh tìm kiếm -->
    <div class="card shadow-sm mb-3">
        <div class="card-body p-2">
            <form th:action="@{/students}" method="get" class="input-group">
                <input type="text" name="keyword" th:value="${keyword}"
                       class="form-control border-0" placeholder="Tìm theo tên hoặc email..."/>
                <button type="submit" class="btn btn-outline-secondary">
                    <i class="bi bi-search me-1"></i>Tìm kiếm
                </button>
                <a th:if="${keyword != null and !keyword.isBlank()}" th:href="@{/students}"
                   class="btn btn-outline-danger" title="Xóa bộ lọc">
                    <i class="bi bi-x-lg"></i>
                </a>
            </form>
        </div>
    </div>

    <!-- Bảng dữ liệu sinh viên -->
    <div class="card shadow-sm">
        <div class="card-body p-0">

            <!-- Trường hợp rỗng -->
            <div th:if="${#lists.isEmpty(students)}" class="text-center p-5 text-muted">
                <i class="bi bi-inbox display-4"></i>
                <p class="mt-2">Chưa có sinh viên nào.</p>
                <a th:href="@{/students/create}" class="btn btn-outline-primary">Thêm ngay</a>
            </div>

            <!-- Bảng dữ liệu -->
            <table th:unless="${#lists.isEmpty(students)}" class="table table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Họ tên</th>
                    <th>Email</th>
                    <th>Tuổi</th>
                    <th>Chuyên ngành</th>
                    <th>GPA</th>
                    <th class="text-center">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="student, stat : ${students}">
                    <td th:text="${stat.count}">1</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           th:text="${student.name}"
                           class="text-decoration-none fw-semibold">Tên</a>
                    </td>
                    <td th:text="${student.email}">email</td>
                    <td th:text="${student.age}">20</td>
                    <td>
                        <span class="badge bg-dark"
                              th:text="${student.major == 'CNTT' ? 'CNTT - Công nghệ thông tin' :
                                       (student.major == 'KTPM' ? 'KTPM - Kỹ thuật phần mềm' :
                                       (student.major == 'ATTT' ? 'ATTT - An toàn thông tin' :
                                       (student.major == 'HTTT' ? 'HTTT - Hệ thống thông tin' :
                                       (student.major == 'MMT'  ? 'MMT - Mạng máy tính' : student.major))))}">CNTT</span>
                    </td>
                    <td>
                        <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                              (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                              th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/students/{id}(id=${student.id})}"
                           class="btn btn-sm btn-outline-secondary me-1" title="Chi tiết">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/students/{id}/edit(id=${student.id})}"
                           class="btn btn-sm btn-outline-secondary me-1" title="Sửa">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/students/{id}/delete(id=${student.id})}"
                              method="post" class="d-inline"
                              th:data-name="${student.name}"
                              onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                            <button type="submit" class="btn btn-sm btn-outline-secondary" title="Xóa">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(students)}" class="text-muted mt-2">
        <small>Tổng: <strong th:text="${#lists.size(students)}">0</strong> sinh viên</small>
    </div>

</section>
</body>
</html>
